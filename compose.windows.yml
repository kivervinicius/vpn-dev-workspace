# Override usado somente por scripts/vpn.ps1 no Windows.
# Requer Docker Compose >= 2.24.4 para substituir a lista de volumes com
# !override, sem herdar mounts Linux (C:\, /run/user e /dev/null).
services:
  terminal:
    environment:
      HOME: /home/developer
      PATH: /home/developer/.local/bin:/home/developer/.opencode/bin:/home/developer/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      SSH_AUTH_SOCK: /tmp/vpn-ssh-agent.sock
      # TUI sem placa de som: device default do ALSA -> null (evita mensagens
      # "ALSA lib ..." quebrando a tela quando attention.sound esta ligado).
      ALSA_CONFIG_PATH: /etc/alsa-null.conf
      # Mapeamento host<->container usado pelo vpn-session-sync para reescrever os
      # diretorios gravados nas conversas (sessoes do Windows nao resolvem aqui).
      VPN_HOST_WORKSPACE_DIR: ${WINDOWS_WORKSPACE_DIR:?WINDOWS_WORKSPACE_DIR is required}
      VPN_HOST_HOME_DIR: ${HOST_HOME_DIR:?HOST_HOME_DIR is required}
      VPN_CONTAINER_WORKSPACE_DIR: /workspace
      VPN_CONTAINER_HOME_DIR: /home/developer
      WINDOWS_SSH_BRIDGE_HOST: ${WINDOWS_SSH_BRIDGE_HOST:-host.docker.internal}
      WINDOWS_SSH_BRIDGE_PORT: ${WINDOWS_SSH_BRIDGE_PORT:?WINDOWS_SSH_BRIDGE_PORT is required}
      WINDOWS_SSH_BRIDGE_TOKEN: ${WINDOWS_SSH_BRIDGE_TOKEN:?WINDOWS_SSH_BRIDGE_TOKEN is required}
    volumes: !override
      - vpn_windows_home:/home/developer
      # Sintaxe longa preserva a letra da unidade e espaços no caminho Windows.
      - type: bind
        source: ${WINDOWS_WORKSPACE_DIR:?WINDOWS_WORKSPACE_DIR is required}
        target: /workspace
      - ./scripts/vpn-status:/usr/local/bin/vpn-status:ro
      - ./scripts/vpn-reconnect:/usr/local/bin/vpn-reconnect:ro
      - ./scripts/vpn-check:/usr/local/bin/vpn-check:ro
      - ./scripts/vpn-top:/usr/local/bin/vpn-top:ro
      - ./scripts/vpn-server-rotate:/usr/local/bin/vpn-server-rotate:ro
      - ./scripts/vpn-opencode:/usr/local/bin/vpn-opencode:ro
      - ./scripts/vpn-hosts-import:/usr/local/bin/vpn-hosts-import:ro
      - ./scripts/vpn-hosts-apply:/usr/local/bin/vpn-hosts-apply:ro
      - ./scripts/vpn-ssh-agent-relay:/usr/local/bin/vpn-ssh-agent-relay:ro
      - ./scripts/vpn-home-link:/usr/local/bin/vpn-home-link:ro
      - ./config/alsa-null.conf:/etc/alsa-null.conf:ro
      # Paridade com o host: home Windows inteira em /mnt/host-home. O boot roda
      # vpn-home-link (symlinks configuraveis por WINDOWS_HOME_LINKS).
      # SQLite (.local/share/opencode) NAO e linkado (File Sharing sem locks
      # POSIX): as conversas sao sincronizadas pelo wrapper `opencode` abaixo.
      - type: bind
        source: ${HOST_HOME_DIR:?HOST_HOME_DIR is required}
        target: /mnt/host-home
      # Wrapper do opencode (prioridade no PATH): importa as conversas do host
      # ao abrir e publica no staging ao fechar, sem comandos manuais.
      - ./scripts/vpn-opencode-wrapper:/home/developer/.local/bin/opencode:ro
      - ./scripts/vpn-session-sync:/usr/local/bin/vpn-session-sync:ro
      - ./.vpn/sync:/tmp/vpn-session-sync
    working_dir: /workspace
    command: ["bash", "-lc", "/usr/local/bin/vpn-home-link; exec /usr/local/bin/vpn-ssh-agent-relay"]


  opencode-supervisor:
    environment:
      HOME: /home/developer
      PATH: /home/developer/.opencode/bin:/home/developer/.local/bin:/home/developer/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      SSH_AUTH_SOCK: /tmp/vpn-ssh-agent.sock
      ALSA_CONFIG_PATH: /etc/alsa-null.conf
      WINDOWS_SSH_BRIDGE_HOST: ${WINDOWS_SSH_BRIDGE_HOST:-host.docker.internal}
      WINDOWS_SSH_BRIDGE_PORT: ${WINDOWS_SSH_BRIDGE_PORT:?WINDOWS_SSH_BRIDGE_PORT is required}
      WINDOWS_SSH_BRIDGE_TOKEN: ${WINDOWS_SSH_BRIDGE_TOKEN:?WINDOWS_SSH_BRIDGE_TOKEN is required}
    volumes: !override
      - vpn_windows_home:/home/developer
      - type: bind
        source: ${WINDOWS_WORKSPACE_DIR:?WINDOWS_WORKSPACE_DIR is required}
        target: /workspace
      - ./scripts/opencode-supervisor:/usr/local/bin/opencode-supervisor:ro
      - ./scripts/vpn-check:/usr/local/bin/vpn-check:ro
      - ./scripts/vpn-reconnect:/usr/local/bin/vpn-reconnect:ro
      - ./scripts/vpn-server-rotate:/usr/local/bin/vpn-server-rotate:ro
      - ./scripts/vpn-ssh-agent-relay:/usr/local/bin/vpn-ssh-agent-relay:ro
      - ./scripts/vpn-home-link:/usr/local/bin/vpn-home-link:ro
      - ./config/alsa-null.conf:/etc/alsa-null.conf:ro
      # Paridade com o host: home Windows inteira em /mnt/host-home; o boot roda
      # vpn-home-link (symlinks configuraveis via WINDOWS_HOME_LINKS). SQLite
      # NAO e linkado (File Sharing sem locks POSIX); sessoes via snapshot no
      # vpn.ps1 (start/stop).
      - type: bind
        source: ${HOST_HOME_DIR:?HOST_HOME_DIR is required}
        target: /mnt/host-home
    working_dir: /workspace
    command: ["bash", "-lc", "/usr/local/bin/vpn-home-link; /usr/local/bin/vpn-ssh-agent-relay & exec bash /usr/local/bin/opencode-supervisor"]

volumes:
  vpn_windows_home:
