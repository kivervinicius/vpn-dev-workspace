# Configuracao minima do ALSA para o container (sem placa de som).
#
# O compose base define ALSA_CONFIG_PATH=/dev/null, o que deixa o ALSA sem
# configuracao: qualquer tentativa de tocar som (o OpenCode faz isso quando
# attention.sound esta ligado no cli.json compartilhado com o host) imprime
# "ALSA lib pcm.c:(snd_pcm_open_noupdate) Unknown PCM default" no terminal e
# quebra o TUI.
#
# Aqui a configuracao do sistema e carregada e o dispositivo default e
# redirecionado para o plugin "null" do ALSA: o som "toca" silenciosamente.
</usr/share/alsa/alsa.conf>
pcm.!default { type null }
ctl.!default { type null }