services:
  # Container VPN usando Gluetun. O perfil selecionado fornece o provedor.
  vpn:
    image: qmcgaw/gluetun:latest
    entrypoint: ["/usr/local/bin/vpn-entrypoint.sh"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-nordvpn}
      VPN_TYPE: ${VPN_TYPE:-openvpn}
      GLUETUN_API_KEY_FILE: /run/secrets/gluetun_api_key
    ports:
      # Disponíveis apenas no computador local por padrão.
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:3000:3000"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:4200:4200"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:5173:5173"
    secrets:
      - gluetun_api_key
    volumes:
      - ./scripts/vpn-entrypoint.sh:/usr/local/bin/vpn-entrypoint.sh:ro
    restart: unless-stopped

  # Ambiente de terminal construído a partir do Dockerfile.
  terminal:
    build: .
    network_mode: "service:vpn"
    command: tail -f /dev/null
    environment:
      GLUETUN_API_KEY_FILE: /run/secrets/gluetun_api_key
      ALSA_CONFIG_PATH: /dev/null
    volumes:
      - /home/desenvolvedor:/home/desenvolvedor
      - ${WORKSPACE_DIR:-/projetos}:/projetos
      # Todo o estado canônico do OpenCode; nenhuma pasta pessoal genérica.
      - ${OPENCODE_INSTALL_DIR:-~/.opencode}:/root/.opencode
      - ${OPENCODE_CONFIG_DIR:-~/.config/opencode}:/root/.config/opencode
      - ${OPENCODE_DATA_DIR:-~/.local/share/opencode}:/root/.local/share/opencode
      - ${OPENCODE_STATE_DIR:-~/.local/state/opencode}:/root/.local/state/opencode
      - ${OPENCODE_CACHE_DIR:-~/.cache/opencode}:/root/.cache/opencode
      - ./scripts/vpn-status:/usr/local/bin/vpn-status:ro
      - ./scripts/vpn-reconnect:/usr/local/bin/vpn-reconnect:ro
    working_dir: /projetos
    depends_on:
      - vpn
    secrets:
      - gluetun_api_key
    restart: unless-stopped

secrets:
  gluetun_api_key:
    file: ${GLUETUN_API_KEY_FILE:?GLUETUN_API_KEY_FILE is required}
