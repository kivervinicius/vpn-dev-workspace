services:
  # O Gluetun é a única superfície de rede publicada pelo ambiente.
  vpn:
    # Só é iniciado pelo vpn-switch, que combina este arquivo com um perfil de provedor.
    profiles: ["vpn"]
    image: vpn-dev-workspace-gluetun:v3.41.3-publicip-recovery.1
    build:
      context: ./gluetun
    pull_policy: build
    entrypoint: ["/usr/local/bin/vpn-entrypoint.sh"]
    cap_add:
      - NET_ADMIN
      # Os segredos locais são bind mounts com modo 0600 e pertencem ao
      # usuário do host; estas capabilities permitem ao entrypoint root
      # lê-los e ao Gluetun reescrever seus arquivos de runtime sem reabrir
      # todas as capabilities removidas abaixo.
      - DAC_READ_SEARCH
      - DAC_OVERRIDE
      # O Gluetun gera o perfil OpenVPN e ajusta o dono do arquivo antes de
      # reduzir o processo ao UID/GID configurado na imagem.
      - CHOWN
      - SETUID
      - SETGID
      # Permite ao processo supervisor do Gluetun (root) enviar sinais
      # (SIGTERM/SIGKILL) para encerrar processos filhos (openvpn/wireguard)
      # que rodam sob UID não-root.
      - KILL
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/net/tun:/dev/net/tun
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
          pids: 256
    stop_grace_period: 30s
    dns:
      # Resolução dentro do túnel pelo servidor DNS embutido do Gluetun.
      - 127.0.0.1
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-nordvpn}
      VPN_TYPE: ${VPN_TYPE:-openvpn}
      GLUETUN_API_KEY_FILE: /run/secrets/gluetun_api_key
      # Serviço consultado pelo Gluetun para obter o IP público.
      PUBLICIP_API: ifconfigco
      # Acesso à rede interna do host (opt-in): sub-redes permitidas fora do túnel.
      FIREWALL_OUTBOUND_SUBNETS: ${FIREWALL_SUBNETS:-}
      # Resolução de nomes internos (ex: *.omega): quando INTERNAL_DNS estiver
      # definido, o vpn-switch exporta DNS_UPSTREAM_RESOLVER_TYPE=plain para o
      # Gluetun obedecer ao upstream plain (sem isso ele ignora e usa DoT).
      # Veja .env.example.
      DNS_UPSTREAM_RESOLVER_TYPE: ${DNS_UPSTREAM_RESOLVER_TYPE:-dot}
      # O hífen simples preserva uma string vazia explícita no modo plain.
      DNS_UPSTREAM_RESOLVERS: ${INTERNAL_DNS_RESOLVERS-cloudflare}
      DNS_UPSTREAM_PLAIN_ADDRESSES: ${INTERNAL_DNS:-}
      DNS_REBINDING_PROTECTION_EXEMPT_HOSTNAMES: ${INTERNAL_DNS_EXEMPT_HOSTNAMES:-}
      # Proxy HTTP pela VPN (opt-in): porta dentro de VPN_PORT_RANGE, sem
      # entrada nova em `ports`. Ver .env.example (VPN_HTTP_PROXY*).
      HTTPPROXY: ${VPN_HTTP_PROXY:-off}
      HTTPPROXY_LISTENING_ADDRESS: :${VPN_HTTP_PROXY_PORT:-10002}
      HTTPPROXY_STEALTH: ${VPN_HTTP_PROXY_STEALTH:-on}
      HTTPPROXY_USER: ${VPN_HTTP_PROXY_USER:-}
      # Preferir FILE (caminho) a valor direto: senha em env vaza em docker inspect.
      # O entrypoint lê HTTPPROXY_PASSWORD_FILE e exporta para o Gluetun.
      HTTPPROXY_PASSWORD: ${VPN_HTTP_PROXY_PASSWORD:-}
      HTTPPROXY_PASSWORD_FILE: ${VPN_HTTP_PROXY_PASSWORD_FILE:-}
    ports:
      # A faixa é publicada apenas no endereço configurado do host. O default
      # é estreito (11 portas); amplie só se precisar (ver .env.example).
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${VPN_PORT_RANGE:-10000-10010}:${VPN_PORT_RANGE:-10000-10010}"
    secrets:
      - gluetun_api_key
    volumes:
      - ./scripts/vpn-entrypoint.sh:/usr/local/bin/vpn-entrypoint.sh:ro
    healthcheck:
      # OpenVPN TCP e troca de servidor passam dos 10s padrão da imagem.
      test: ["CMD-SHELL", "/gluetun-entrypoint healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 50s
    restart: unless-stopped

  # Extensão direta do usuário do host, com toda a home disponível pelo túnel VPN.
  terminal:
    profiles: ["vpn"]
    build:
      context: .
      args:
        # Paridade de permissões com o usuário do host (evita "no access").
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    network_mode: "service:vpn"
    # init colhe zumbis de shells/processos filhos (tail/zsh/opencode exec).
    init: true
    # Mantém o container disponível para `docker exec`; limite é tratado por hooks TUI.
    command: ["bash", "-lc", "exec tail -f /dev/null"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
          pids: 1024
    environment:
      ALSA_CONFIG_PATH: /dev/null
      GLUETUN_API_KEY_FILE: /run/secrets/gluetun_api_key
      # Preserva caminhos absolutos, configurações e ferramentas da home do host.
      VPN_WORKSPACE_CONTAINER: "1"
      HOME: ${HOST_HOME_DIR:-${HOME}}
      # Isola apenas o estado do OpenCode no container. O service.json é um
      # singleton por usuário: compartilhar a home fazia host e container
      # sobrescreverem o registro um do outro e derrubar o servidor em loop.
      # XDG_DATA_HOME fica no padrão (~/.local/share) para manter o mesmo
      # DB/sessões/auth do host.
      XDG_STATE_HOME: ${OPENCODE_CONTAINER_STATE_HOME:-${HOST_HOME_DIR:-${HOME}}/.local/state-vpn}
      PATH: ${HOST_HOME_DIR:-${HOME:-/home/developer}}/.opencode/bin:${HOST_HOME_DIR:-${HOME:-/home/developer}}/.local/bin:${HOST_HOME_DIR:-${HOME:-/home/developer}}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      SHELL: /usr/bin/zsh
      # Paridade de título/TTY: `docker compose exec`/`docker exec` não
      # encaminham TERM sozinhos (dentro ficava vazio e OMZ/IAs não emitiam
      # OSC 0/1/2 para a aba). Interpolado a cada invocação, então até o exec
      # direto herda o TERM corrente do host; sem TERM no host, xterm-256color.
      TERM: ${TERM:-xterm-256color}
      # Rotação automática de servidor (opt-in; ver .env.example).
      VPN_ROTATE_SERVERS: ${VPN_ROTATE_SERVERS:-false}
      VPN_SERVER_HOSTNAMES: ${VPN_SERVER_HOSTNAMES:-}
      VPN_RECONNECT_ATTEMPTS_BEFORE_ROTATE: ${VPN_RECONNECT_ATTEMPTS_BEFORE_ROTATE:-3}
      VPN_ROTATE_STATE_FILE: /var/lib/vpn-control/vpn-rotate.index
      # Hosts locais mapeados (opt-in): o vpn-check valida cada nome=ip.
      LOCAL_HOSTS: ${LOCAL_HOSTS:-}
      # Observabilidade do OpenCode (opt-in; só sonda, nunca reinicia aqui).
      OPENCODE_GUI_PORT: ${OPENCODE_GUI_PORT:-10001}
      OPENCODE_QUOTA_PATTERNS: ${OPENCODE_QUOTA_PATTERNS:-}
      OPENCODE_ZEN_PATTERNS: ${OPENCODE_ZEN_PATTERNS:-}
      OPENCODE_FREE_TIER_LIMIT_PATTERNS: ${OPENCODE_FREE_TIER_LIMIT_PATTERNS:-}
      OPENCODE_ACCOUNT_LIMIT_PATTERNS: ${OPENCODE_ACCOUNT_LIMIT_PATTERNS:-}
      OPENCODE_CREDIT_LIMIT_PATTERNS: ${OPENCODE_CREDIT_LIMIT_PATTERNS:-}
      OPENCODE_CHECK_LOG_LINES: ${OPENCODE_CHECK_LOG_LINES:-200}
      OPENCODE_LIMIT_ROTATE_ATTEMPTS: ${OPENCODE_LIMIT_ROTATE_ATTEMPTS:-3}
      # Sessão SSH do host, quando existir (senão /dev/null, inofensivo).
      SSH_AUTH_SOCK: /run/vpn-ssh-agent.sock
    volumes:
      # O mesmo caminho nos dois lados permite reutilizar referências absolutas.
      # HOST_HOME_MODE=ro trava a home como somente-leitura (default rw por compat).
      - ${HOST_HOME_DIR:-${HOME}}:${HOST_HOME_DIR:-${HOME}}:${HOST_HOME_MODE:-rw}
      - ${WORKSPACE_DIR:-/projetos}:${WORKSPACE_DIR:-/projetos}
      # Agente SSH e sessão do usuário do host (keyring/dbus), quando existirem.
      - ${SSH_AUTH_SOCK:-/dev/null}:/run/vpn-ssh-agent.sock:ro
      - ${RUN_USER_DIR:-/dev/null}:${RUN_USER_DIR:-/dev/null}:ro
      - ./scripts/vpn-status:/usr/local/bin/vpn-status:ro
      - ./scripts/vpn-reconnect:/usr/local/bin/vpn-reconnect:ro
      - ./scripts/vpn-check:/usr/local/bin/vpn-check:ro
      - ./scripts/vpn-top:/usr/local/bin/vpn-top:ro
      - ./scripts/vpn-server-rotate:/usr/local/bin/vpn-server-rotate:ro
      - ./scripts/vpn-opencode:/usr/local/bin/vpn-opencode:ro
      - ./scripts/vpn-control-lock.sh:/usr/local/bin/vpn-control-lock.sh:ro
      - ./scripts/opencode-limit-recover:/usr/local/bin/opencode-limit-recover:ro
      # Senha do painel web do OpenCode (basic auth), quando existir arquivo.
      # Sem arquivo o painel abre sem senha: só use com HOST_BIND_ADDRESS=127.0.0.1.
      - ${OPENCODE_GUI_PASSWORD_FILE:-/dev/null}:/run/secrets/opencode_gui_password:ro
      - vpn_control_state:/var/lib/vpn-control
    working_dir: ${WORKSPACE_DIR:-/projetos}
    depends_on:
      vpn:
        condition: service_healthy
    secrets:
      - gluetun_api_key
    restart: unless-stopped

  # Recupera a conectividade VPN periodicamente, sem acesso ao socket Docker.
  vpn-auto-reconnect:
    profiles: ["vpn"]
    build: .
    network_mode: "service:vpn"
    command: ["/usr/local/bin/vpn-auto-reconnect"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 64
    environment:
      GLUETUN_API_KEY_FILE: /run/secrets/gluetun_api_key
      VPN_RECONNECT_INTERVAL_SECONDS: ${VPN_RECONNECT_INTERVAL_SECONDS:-3600}
      VPN_RECONNECT_RETRY_SECONDS: ${VPN_RECONNECT_RETRY_SECONDS:-30}
      # Rotação automática de servidor (opt-in; ver .env.example).
      VPN_ROTATE_SERVERS: ${VPN_ROTATE_SERVERS:-false}
      VPN_SERVER_HOSTNAMES: ${VPN_SERVER_HOSTNAMES:-}
      VPN_RECONNECT_ATTEMPTS_BEFORE_ROTATE: ${VPN_RECONNECT_ATTEMPTS_BEFORE_ROTATE:-3}
      # Rotação periódica (privacidade) + estado round-robin (ver .env.example).
      VPN_ROTATE_INTERVAL_SECONDS: ${VPN_ROTATE_INTERVAL_SECONDS:-0}
      VPN_ROTATE_STATE_FILE: /var/lib/vpn-control/vpn-rotate.index
      # Hosts locais mapeados (opt-in): o vpn-check valida cada nome=ip.
      LOCAL_HOSTS: ${LOCAL_HOSTS:-}
      # Sonda do OpenCode (opt-in; alerta puro, sem reconnect do túnel).
      OPENCODE_AUTOCHECK: ${OPENCODE_AUTOCHECK:-false}
      OPENCODE_GUI_PORT: ${OPENCODE_GUI_PORT:-10001}
      OPENCODE_QUOTA_PATTERNS: ${OPENCODE_QUOTA_PATTERNS:-}
      OPENCODE_ZEN_PATTERNS: ${OPENCODE_ZEN_PATTERNS:-}
      OPENCODE_FREE_TIER_LIMIT_PATTERNS: ${OPENCODE_FREE_TIER_LIMIT_PATTERNS:-}
      OPENCODE_ACCOUNT_LIMIT_PATTERNS: ${OPENCODE_ACCOUNT_LIMIT_PATTERNS:-}
      OPENCODE_CREDIT_LIMIT_PATTERNS: ${OPENCODE_CREDIT_LIMIT_PATTERNS:-}
      OPENCODE_CHECK_LOG_LINES: ${OPENCODE_CHECK_LOG_LINES:-200}
    volumes:
      - ./scripts/vpn-status:/usr/local/bin/vpn-status:ro
      - ./scripts/vpn-reconnect:/usr/local/bin/vpn-reconnect:ro
      - ./scripts/vpn-check:/usr/local/bin/vpn-check:ro
      - ./scripts/vpn-server-rotate:/usr/local/bin/vpn-server-rotate:ro
      - ./scripts/vpn-auto-reconnect:/usr/local/bin/vpn-auto-reconnect:ro
      - ./scripts/vpn-opencode:/usr/local/bin/vpn-opencode:ro
      - ./scripts/vpn-control-lock.sh:/usr/local/bin/vpn-control-lock.sh:ro
      - vpn_control_state:/var/lib/vpn-control
    depends_on:
      vpn:
        condition: service_healthy
    secrets:
      - gluetun_api_key
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat /tmp/vpn-auto-reconnect.state 2>/dev/null)\" = healthy"]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 2m
    restart: unless-stopped


  # OpenCode autônomo: possui o processo filho e recupera app+VPN sem Docker socket.
  # É opt-in e iniciado pelo helper vpn-opencode supervise.
  opencode-supervisor:
    profiles: ["opencode"]
    build:
      context: .
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    network_mode: "service:vpn"
    init: true
    command: ["bash", "/usr/local/bin/opencode-supervisor"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
          pids: 1024
    environment:
      HOME: ${HOST_HOME_DIR:-${HOME}}
      # Mesmo isolamento de estado do serviço `terminal`: o supervisor não
      # pode disputar o service.json do OpenCode do host. O banco/sessões
      # continuam compartilhados via XDG_DATA_HOME padrão.
      XDG_STATE_HOME: ${OPENCODE_CONTAINER_STATE_HOME:-${HOST_HOME_DIR:-${HOME}}/.local/state-vpn}
      PATH: ${HOST_HOME_DIR:-${HOME:-/home/developer}}/.opencode/bin:${HOST_HOME_DIR:-${HOME:-/home/developer}}/.local/bin:${HOST_HOME_DIR:-${HOME:-/home/developer}}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      SHELL: /usr/bin/zsh
      SSH_AUTH_SOCK: /run/vpn-ssh-agent.sock
      GLUETUN_API_KEY_FILE: /run/secrets/gluetun_api_key
      VPN_SERVER_HOSTNAMES: ${VPN_SERVER_HOSTNAMES:-}
      VPN_ROTATE_STATE_FILE: /var/lib/vpn-control/vpn-rotate.index
      VPN_IP_ATTEMPTS: ${VPN_IP_ATTEMPTS:-30}
      VPN_IP_DELAY_SECONDS: ${VPN_IP_DELAY_SECONDS:-5}
      OPENCODE_SUPERVISOR_MODE: ${OPENCODE_SUPERVISOR_MODE:-serve}
      OPENCODE_GUI_PORT: ${OPENCODE_GUI_PORT:-10001}
      OPENCODE_SERVER_USER: ${OPENCODE_SERVER_USER:-opencode}
      # Preferir arquivo (volume acima) a valor direto: env vaza em docker inspect.
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      OPENCODE_SUPERVISOR_INTERVAL_SECONDS: ${OPENCODE_SUPERVISOR_INTERVAL_SECONDS:-10}
      OPENCODE_RECOVERY_COOLDOWN_SECONDS: ${OPENCODE_RECOVERY_COOLDOWN_SECONDS:-30}
      OPENCODE_RECOVERY_WINDOW_SECONDS: ${OPENCODE_RECOVERY_WINDOW_SECONDS:-900}
      OPENCODE_RECOVERY_MAX_ROTATIONS: ${OPENCODE_RECOVERY_MAX_ROTATIONS:-3}
      OPENCODE_READY_ATTEMPTS: ${OPENCODE_READY_ATTEMPTS:-30}
      OPENCODE_READY_DELAY_SECONDS: ${OPENCODE_READY_DELAY_SECONDS:-2}
      OPENCODE_VPN_READY_ATTEMPTS: ${OPENCODE_VPN_READY_ATTEMPTS:-30}
      OPENCODE_VPN_READY_DELAY_SECONDS: ${OPENCODE_VPN_READY_DELAY_SECONDS:-2}
      OPENCODE_SUPERVISOR_SESSION_FILE: ${OPENCODE_SUPERVISOR_SESSION_FILE:-}
      OPENCODE_DISCONNECT_PATTERNS: ${OPENCODE_DISCONNECT_PATTERNS:-}
    volumes:
      - ${HOST_HOME_DIR:-${HOME}}:${HOST_HOME_DIR:-${HOME}}:${HOST_HOME_MODE:-rw}
      - ${WORKSPACE_DIR:-/projetos}:${WORKSPACE_DIR:-/projetos}
      - ${SSH_AUTH_SOCK:-/dev/null}:/run/vpn-ssh-agent.sock:ro
      - ${RUN_USER_DIR:-/dev/null}:${RUN_USER_DIR:-/dev/null}:ro
      - ./scripts/opencode-supervisor:/usr/local/bin/opencode-supervisor:ro
      - ./scripts/vpn-check:/usr/local/bin/vpn-check:ro
      - ./scripts/vpn-reconnect:/usr/local/bin/vpn-reconnect:ro
      - ./scripts/vpn-server-rotate:/usr/local/bin/vpn-server-rotate:ro
      - ./scripts/vpn-control-lock.sh:/usr/local/bin/vpn-control-lock.sh:ro
      - vpn_control_state:/var/lib/vpn-control
      # Sem arquivo o painel abre sem senha: só use com HOST_BIND_ADDRESS=127.0.0.1.
      - ${OPENCODE_GUI_PASSWORD_FILE:-/dev/null}:/run/secrets/opencode_gui_password:ro
    working_dir: ${WORKSPACE_DIR:-/projetos}
    depends_on:
      vpn:
        condition: service_healthy
    secrets:
      - gluetun_api_key
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/opencode-supervisor/opencode.pid && kill -0 \"$$(cat /tmp/opencode-supervisor/opencode.pid 2>/dev/null)\""]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 1m
    restart: unless-stopped

secrets:
  gluetun_api_key:
    file: ${GLUETUN_API_KEY_FILE:?GLUETUN_API_KEY_FILE is required}
volumes:
  vpn_control_state:
