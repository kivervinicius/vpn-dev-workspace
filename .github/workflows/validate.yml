name: Validate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Validate shell scripts
        run: find scripts -maxdepth 1 -type f ! -name '*.ps1' -print0 | xargs -0 shellcheck -S error && bash -n scripts/* && sh -n scripts/vpn-entrypoint.sh && git diff --check
      - name: Test OpenCode recovery classifier
        run: |
          test "$(bash ./scripts/opencode-supervisor --classify '429 Too Many Requests')" = "limit"
          test "$(bash ./scripts/opencode-supervisor --classify 'OpenCode Go usage limit reached')" = "limit"
          test "$(bash ./scripts/opencode-supervisor --classify 'connection lost while streaming')" = "disconnect"
          test "$(bash ./scripts/opencode-supervisor --classify 'normal request completed')" = "none"
      - name: Validate documentation
        run: ./scripts/verify-docs
      - name: Validate Compose profiles
        run: ./scripts/verify-compose
      - name: Build terminal image
        run: docker build --pull=true .

  validate-windows-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test PowerShell interface with simulated Docker
        shell: pwsh
        run: Invoke-Pester -Path tests/windows -CI
