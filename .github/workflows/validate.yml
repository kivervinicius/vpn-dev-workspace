name: Validate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install ShellCheck, socat and zsh
        # socat é usado pela suíte para servir respostas HTTP nos testes de
        # classificação do `vpn-opencode check`; zsh valida o hook de título
        # (`.zsh` não é suportado pelo ShellCheck e não é bash).
        run: sudo apt-get update && sudo apt-get install --yes shellcheck socat zsh
      - name: Run the complete local verification gate
        run: make verify

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan do historico por segredos (gitleaks pinado por digest)
        # Imagem pinada por digest (mesma politica dos outros pins); --redact para
        # nao ecoar valores encontrados. Falha o job quando encontra segredos.
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --no-banner --redact --verbose

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Scan de configuracao e segredos (trivy pinado por SHA)
        # Misconfig (Dockerfile/Compose) + segredos no repositorio; somente
        # CRITICAL falha o job. SHA = commit da tag v0.36.0 (dependabot
        # atualiza via ecosystem github-actions).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: misconfig,secret
          severity: CRITICAL
          exit-code: "1"
          format: table

  workflow-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: actionlint (binario pinado por sha256)
        # actionlint v1.7.12; checksum conferido no download.
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 3 -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint
      - name: zizmor (versao pinada)
        # zizmor 1.33.1: analise estatica de GitHub Actions (permissoes,
        # injecao de template, uses nao fixados).
        run: pipx run --spec zizmor==1.33.1 zizmor --format plain .github/workflows

  validate-windows-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test PowerShell interface with simulated Docker
        shell: pwsh
        run: Invoke-Pester -Path tests/windows -CI
