name: Validate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck, socat and zsh
        # socat é usado pela suíte para servir respostas HTTP nos testes de
        # classificação do `vpn-opencode check`; zsh valida o hook de título
        # (`.zsh` não é suportado pelo ShellCheck e não é bash).
        run: sudo apt-get update && sudo apt-get install --yes shellcheck socat zsh
      - name: Validate shell scripts
        run: find scripts -maxdepth 1 -type f ! -name '*.ps1' ! -name '*.zsh' -print0 | xargs -0 shellcheck -S error && find scripts -maxdepth 1 -type f ! -name '*.ps1' ! -name '*.zsh' -exec bash -n {} + && sh -n scripts/vpn-entrypoint.sh && find scripts -maxdepth 1 -type f -name '*.zsh' -exec zsh -n {} + && git diff --check
      - name: Run Linux scripts test suite
        run: ./tests/linux/test-scripts.sh
      - name: Test OpenCode recovery classifier
        run: |
          test "$(bash ./scripts/opencode-supervisor --classify '429 Too Many Requests')" = "rate_limit"
          test "$(bash ./scripts/opencode-supervisor --classify 'Provider rate limit exceeded')" = "rate_limit"
          test "$(bash ./scripts/opencode-supervisor --classify 'FreeUsageLimitError: Free usage exceeded, subscribe to Go')" = "free_tier_limit"
          test "$(bash ./scripts/opencode-supervisor --classify 'Free limit reached')" = "free_tier_limit"
          test "$(bash ./scripts/opencode-supervisor --classify 'reason=free_tier_limit')" = "free_tier_limit"
          test "$(bash ./scripts/opencode-supervisor --classify 'Go limit reached: usage limit reached. It will reset in 5 days')" = "account_limit"
          test "$(bash ./scripts/opencode-supervisor --classify 'CreditLimitExceeded: credit limit exceeded')" = "credit_limit"
          test "$(bash ./scripts/opencode-supervisor --classify 'InsufficientFunds: payment required')" = "credit_limit"
          test "$(bash ./scripts/opencode-supervisor --classify 'connection lost while streaming')" = "disconnect"
          test "$(bash ./scripts/opencode-supervisor --classify 'normal request completed')" = "none"
      - name: Validate documentation
        run: ./scripts/verify-docs
      - name: Validate Compose profiles
        run: ./scripts/verify-compose
      - name: Build terminal image
        run: docker build --pull=true .

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan do historico por segredos (gitleaks pinado por digest)
        # Imagem pinada por digest (mesma politica dos outros pins); --redact para
        # nao ecoar valores encontrados. Falha o job quando encontra segredos.
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --no-banner --redact --verbose

  validate-windows-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test PowerShell interface with simulated Docker
        shell: pwsh
        run: Invoke-Pester -Path tests/windows -CI
