# Manutencao automatica dos pins (item #9 do backlog).
# Cobre: Actions do workflow (checkout etc.) e a imagem base do Dockerfile
# (ubuntu jammy por digest). NAO cobre os ARGs NODE_VERSION/OPENCODE_VERSION
# e os checksums: esses bumps sao manuais, conforme o runbook
# DEV/RUNBOOKS/opencode-desktop-vpn.md.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore"
      include: scope

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore"
      include: scope
